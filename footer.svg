<svg width="500" height="60" viewBox="0 0 500 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pinyon+Script&amp;display=swap');
    
    .text {
      font-family: 'Pinyon Script', cursive;
      font-size: 36px;
      fill: #667EEA;
      text-anchor: middle;
      animation: pulsate 3s infinite ease-in-out;
    }

    @keyframes pulsate {
      0% {
        fill: #667EEA;
        opacity: 0.8;
        transform: scale(1);
      }
      50% {
        fill: #764ba2;
        opacity: 1;
        transform: scale(1.05); /* Slight breathing effect */
        text-shadow: 0 0 10px rgba(118, 75, 162, 0.4);
      }
      100% {
        fill: #667EEA;
        opacity: 0.8;
        transform: scale(1);
      }
    }
  </style>

  <rect width="100%" height="100%" fill="transparent"/>
  <text x="50%" y="50%" dominant-baseline="middle" class="text">
    less is more
  </text>
</svg>
